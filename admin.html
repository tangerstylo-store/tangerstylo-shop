
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TANGERSTYLO - إدارة المتجر</title>
<style>
body{font-family:Arial,sans-serif;background:#eef4f9;margin:0;padding:20px;color:#203040}
main{max-width:850px;margin:auto}
h1{text-align:center;color:#123653}
section{background:white;padding:20px;margin:16px 0;border-radius:12px;box-shadow:0 2px 10px #0001}
input,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:1px solid #ccd6df;border-radius:7px;font-size:16px}
button{background:#1769aa;color:white;border:0;cursor:pointer}
button.danger{background:#b83232}
.hidden{display:none}
.product{border-bottom:1px solid #ddd;padding:12px 0}
</style>
</head>
<body>
<main>
<h1>إدارة متجر TANGERSTYLO</h1>

<section id="login">
<h2>دخول الإدارة</h2>
<input id="password" type="password" placeholder="كلمة مرور الإدارة">
<button onclick="login()">دخول</button>
<p id="loginMsg"></p>
</section>

<div id="dashboard" class="hidden">
<section>
<h2>إضافة منتج جديد</h2>
<input id="name" placeholder="اسم المنتج">
<input id="price" type="number" min="0" placeholder="الثمن بالدرهم">
<input id="category" placeholder="الصنف">
<input id="stock" type="number" min="0" placeholder="الكمية">
<input id="image" placeholder="رابط صورة المنتج">
<textarea id="description" placeholder="وصف المنتج"></textarea>
<button onclick="addProduct()">إضافة المنتج</button>
<p id="msg"></p>
</section>

<section>
<h2>المنتجات المسجلة</h2>
<div id="products">جاري التحميل...</div>
</section>

<section>
<h2>الطلبات</h2>
<button onclick="loadOrders()">تحديث الطلبات</button>
<div id="orders"></div>
</section>
</div>
</main>

<script>
let adminPassword="";

async function api(path,options={}){
 const headers={...(options.headers||{}),"Authorization":"Bearer "+adminPassword};
 if(options.body) headers["Content-Type"]="application/json";
 const response=await fetch(path,{...options,headers});
 const data=await response.json();
 if(!response.ok) throw new Error(data.message||"حدث خطأ");
 return data;
}

async function login(){
 adminPassword=document.getElementById("password").value;
 try{
  await api("/api/admin/products");
  document.getElementById("login").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  loadProducts();
  loadOrders();
 }catch(e){
  adminPassword="";
  document.getElementById("loginMsg").textContent="كلمة المرور غير صحيحة أو تعذر الاتصال";
 }
}

async function addProduct(){
 const data={
  name:document.getElementById("name").value,
  price:document.getElementById("price").value,
  category:document.getElementById("category").value,
  stock:document.getElementById("stock").value,
  image_url:document.getElementById("image").value,
  description:document.getElementById("description").value
 };
 try{
  await api("/api/admin/products",{method:"POST",body:JSON.stringify(data)});
  document.getElementById("msg").textContent="تمت إضافة المنتج بنجاح";
  ["name","price","category","stock","image","description"].forEach(id=>document.getElementById(id).value="");
  loadProducts();
 }catch(e){document.getElementById("msg").textContent=e.message;}
}

async function loadProducts(){
 try{
  const data=await api("/api/admin/products");
  const box=document.getElementById("products");
  box.innerHTML="";
  if(!data.products.length){box.textContent="لا توجد منتجات حاليا";return;}
  data.products.forEach(p=>{
   const div=document.createElement("div");
   div.className="product";
   const title=document.createElement("strong");
   title.textContent=p.name;
   const info=document.createElement("p");
   info.textContent=p.price+" درهم | المخزون: "+p.stock;
   const del=document.createElement("button");
   del.className="danger";
   del.textContent="حذف المنتج";
   del.onclick=async()=>{
    if(confirm("هل تريد حذف هذا المنتج؟")){
     try{await api("/api/admin/products/"+p.id,{method:"DELETE"});loadProducts();}
     catch(e){alert(e.message);}
    }
   };
   div.append(title,info,del);
   box.appendChild(div);
  });
 }catch(e){document.getElementById("products").textContent=e.message;}
}

async function loadOrders(){
 try{
  const data=await api("/api/admin/orders");
  const box=document.getElementById("orders");
  box.textContent=data.orders.length?JSON.stringify(data.orders,null,2):"لا توجد طلبات حاليا";
 }catch(e){document.getElementById("orders").textContent=e.message;}
}
</script>
</body>
</html>

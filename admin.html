
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TANGERSTYLO - إدارة المتجر</title>

<style>
*{box-sizing:border-box}
body{
  font-family:Tahoma,Arial,sans-serif;
  background:#eef4f9;
  margin:0;
  padding:18px;
  color:#203040;
}
main{max-width:900px;margin:auto}
h1{text-align:center;color:#123653}
h2{color:#123653}
section{
  background:white;
  padding:18px;
  margin:16px 0;
  border-radius:12px;
  box-shadow:0 2px 10px #0001;
}
input,textarea,button{
  width:100%;
  padding:12px;
  margin:7px 0;
  border:1px solid #ccd6df;
  border-radius:8px;
  font-size:15px;
  font-family:inherit;
}
textarea{min-height:85px}
button{
  background:#1769aa;
  color:white;
  border:0;
  cursor:pointer;
}
button:disabled{opacity:.6;cursor:wait}
button.danger{background:#b83232}
button.edit{background:#16834a}
button.secondary{background:#687887}
.hidden{display:none}
.product{
  border:1px solid #e1e8ef;
  border-radius:10px;
  padding:14px;
  margin:12px 0;
}
.product img{
  width:100px;
  height:125px;
  object-fit:contain;
  background:#f5f7fa;
  border-radius:7px;
  display:block;
  margin-bottom:10px;
}
.product-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.product-actions button{flex:1;min-width:110px}
.preview{
  max-width:140px;
  max-height:170px;
  object-fit:contain;
  display:none;
  margin:10px auto;
}
.notice{
  padding:10px;
  border-radius:8px;
  background:#eef6fc;
  margin:10px 0;
  line-height:1.7;
}
.order{
  border:1px solid #dce5ed;
  padding:14px;
  margin:12px 0;
  border-radius:10px;
  line-height:1.8;
}
.order-items{
  background:#f5f8fc;
  padding:10px;
  border-radius:8px;
  white-space:pre-wrap;
}
.muted{color:#687887;font-size:13px}
.upload-area{
  background:#f4f8fc;
  border:1px dashed #1769aa;
  border-radius:10px;
  padding:14px;
  margin:10px 0;
}
.upload-status{
  font-size:14px;
  line-height:1.7;
  color:#1769aa;
}
</style>
</head>

<body>
<main>

<h1>📚 إدارة متجر TANGERSTYLO</h1>

<section id="login">
  <h2>دخول الإدارة</h2>
  <input id="password" type="password"
    placeholder="كلمة مرور الإدارة">
  <button onclick="login()">دخول</button>
  <p id="loginMsg"></p>
</section>

<div id="dashboard" class="hidden">

  <section>
    <h2 id="formTitle">➕ إضافة منتج جديد</h2>

    <input id="name" placeholder="اسم المنتج">

    <input id="price" type="number" min="0" step="0.01"
      placeholder="الثمن بالدرهم">

    <input id="category" placeholder="الصنف">

    <input id="stock" type="number" min="0" step="1"
      placeholder="الكمية في المخزون">

    <div class="upload-area">
      <h3>📸 صورة المنتج</h3>
      <p class="muted">
        اختار صورة من الحاسوب ثم اضغط على رفع الصورة.
        الحجم الأقصى 10 ميغابايت.
      </p>

      <input
        id="imageFile"
        type="file"
        accept="image/*"
      >

      <button id="uploadButton" onclick="uploadImage()">
        📤 رفع الصورة من الحاسوب
      </button>

      <p id="uploadStatus" class="upload-status"></p>

      <img id="imagePreview" class="preview" alt="معاينة الصورة">
    </div>

    <label>رابط الصورة (يُملأ تلقائياً بعد الرفع):</label>
    <input id="image" type="url"
      placeholder="رابط الصورة سيظهر هنا"
      oninput="previewImage()">

    <textarea id="description"
      placeholder="وصف المنتج"></textarea>

    <button id="saveButton" onclick="saveProduct()">
      إضافة المنتج
    </button>

    <button id="cancelButton" class="secondary hidden"
      onclick="cancelEdit()">
      إلغاء التعديل
    </button>

    <p id="msg" class="notice"></p>
  </section>

  <section>
    <h2>📦 المنتجات المسجلة</h2>
    <button onclick="loadProducts()">تحديث المنتجات</button>
    <div id="products">جاري التحميل...</div>
  </section>

  <section>
    <h2>🛒 طلبات الزبائن</h2>
    <button onclick="loadOrders()">تحديث الطلبات</button>
    <div id="orders">جاري تحميل الطلبات...</div>
  </section>

</div>
</main>

<script>
let adminPassword = "";
let editingId = null;

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[char]);
}

function safeImageURL(value){
  try{
    const url = new URL(value);
    if(url.protocol === "https:" || url.protocol === "http:"){
      return url.href;
    }
  }catch(e){}
  return "";
}

async function api(path, options = {}){
  const headers = {
    ...(options.headers || {}),
    "Authorization":"Bearer " + adminPassword
  };

  // لا نحدد Content-Type يدوياً عند إرسال FormData
  if(
    options.body &&
    !(options.body instanceof FormData)
  ){
    headers["Content-Type"] = "application/json";
  }

  const response = await fetch(path,{
    ...options,
    headers
  });

  const data = await response.json();

  if(!response.ok){
    throw new Error(data.message || "حدث خطأ");
  }

  return data;
}

async function login(){
  adminPassword = document.getElementById("password").value;

  try{
    await api("/api/admin/products");

    document.getElementById("login").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");

    loadProducts();
    loadOrders();

  }catch(error){
    adminPassword = "";
    document.getElementById("loginMsg").textContent =
      "كلمة المرور غير صحيحة أو تعذر الاتصال.";
  }
}

// رفع الصورة مباشرة من الحاسوب
async function uploadImage(){
  const fileInput = document.getElementById("imageFile");
  const file = fileInput.files[0];

  const button = document.getElementById("uploadButton");
  const status = document.getElementById("uploadStatus");

  if(!file){
    status.textContent = "المرجو اختيار صورة أولاً.";
    return;
  }

  if(!file.type.startsWith("image/")){
    status.textContent = "الملف المختار ليس صورة.";
    return;
  }

  if(file.size > 10 * 1024 * 1024){
    status.textContent = "حجم الصورة يجب ألا يتجاوز 10 ميغابايت.";
    return;
  }

  button.disabled = true;
  button.textContent = "جاري رفع الصورة...";
  status.textContent = "المرجو الانتظار، يتم رفع الصورة الآن...";

  try{
    const formData = new FormData();
    formData.append("file", file);

    const result = await api("/api/admin/upload",{
      method:"POST",
      body:formData
    });

    if(!result.image_url){
      throw new Error("لم يتم إرجاع رابط الصورة.");
    }

    document.getElementById("image").value =
      result.image_url;

    previewImage();

    status.textContent =
      "✅ تم رفع الصورة بنجاح! يمكنك الآن إضافة المنتج.";

  }catch(error){
    status.textContent =
      "❌ فشل رفع الصورة: " + error.message;
  }finally{
    button.disabled = false;
    button.textContent = "📤 رفع الصورة من الحاسوب";
  }
}

function previewImage(){
  const url = safeImageURL(
    document.getElementById("image").value.trim()
  );

  const preview = document.getElementById("imagePreview");

  if(url){
    preview.src = url;
    preview.style.display = "block";
    preview.onerror = () => {
      preview.style.display = "none";
    };
  }else{
    preview.style.display = "none";
  }
}

function getFormData(){
  return {
    name:document.getElementById("name").value.trim(),
    price:document.getElementById("price").value,
    category:document.getElementById("category").value.trim(),
    stock:document.getElementById("stock").value,
    image_url:document.getElementById("image").value.trim(),
    description:document.getElementById("description").value.trim(),
    active:true
  };
}

function validateForm(data){
  if(!data.name){
    alert("المرجو إدخال اسم المنتج.");
    return false;
  }

  if(data.price === "" || !Number.isFinite(Number(data.price))
      || Number(data.price) < 0){
    alert("المرجو إدخال ثمن صحيح.");
    return false;
  }

  if(data.stock === "" || !Number.isInteger(Number(data.stock))
      || Number(data.stock) < 0){
    alert("المرجو إدخال كمية صحيحة.");
    return false;
  }

  if(data.image_url && !safeImageURL(data.image_url)){
    alert("رابط الصورة غير صحيح.");
    return false;
  }

  return true;
}

async function saveProduct(){
  const data = getFormData();

  if(!validateForm(data)) return;

  const button = document.getElementById("saveButton");
  button.disabled = true;
  button.textContent = "جاري الحفظ...";

  try{
    if(editingId !== null){
      await api("/api/admin/products/" + editingId,{
        method:"PUT",
        body:JSON.stringify(data)
      });

      document.getElementById("msg").textContent =
        "تم تعديل المنتج بنجاح.";

    }else{
      await api("/api/admin/products",{
        method:"POST",
        body:JSON.stringify(data)
      });

      document.getElementById("msg").textContent =
        "تمت إضافة المنتج بنجاح.";
    }

    resetForm();
    await loadProducts();

  }catch(error){
    document.getElementById("msg").textContent = error.message;
  }finally{
    button.disabled = false;
    button.textContent =
      editingId !== null ? "حفظ التعديلات" : "إضافة المنتج";
  }
}

function editProduct(product){
  editingId = Number(product.id);

  document.getElementById("formTitle").textContent =
    "✏️ تعديل المنتج: " + product.name;

  document.getElementById("name").value = product.name || "";
  document.getElementById("price").value = product.price ?? "";
  document.getElementById("category").value = product.category || "";
  document.getElementById("stock").value = product.stock ?? 0;
  document.getElementById("image").value = product.image_url || "";
  document.getElementById("description").value =
    product.description || "";

  document.getElementById("saveButton").textContent =
    "حفظ التعديلات";

  document.getElementById("cancelButton").classList.remove("hidden");

  previewImage();

  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEdit(){
  resetForm();
  document.getElementById("msg").textContent =
    "تم إلغاء التعديل.";
}

function resetForm(){
  editingId = null;

  ["name","price","category","stock","image","description"]
    .forEach(id => {
      document.getElementById(id).value = "";
    });

  document.getElementById("imageFile").value = "";
  document.getElementById("uploadStatus").textContent = "";

  document.getElementById("formTitle").textContent =
    "➕ إضافة منتج جديد";

  document.getElementById("saveButton").textContent =
    "إضافة المنتج";

  document.getElementById("cancelButton").classList.add("hidden");
  document.getElementById("imagePreview").style.display = "none";
}

async function loadProducts(){
  const box = document.getElementById("products");
  box.textContent = "جاري تحميل المنتجات...";

  try{
    const data = await api("/api/admin/products");

    if(!data.products || !data.products.length){
      box.textContent = "لا توجد منتجات حاليا.";
      return;
    }

    box.innerHTML = "";

    data.products.forEach(product => {
      const div = document.createElement("div");
      div.className = "product";

      const imageURL = safeImageURL(product.image_url || "");

      if(imageURL){
        const img = document.createElement("img");
        img.src = imageURL;
        img.alt = product.name;
        img.onerror = () => img.remove();
        div.appendChild(img);
      }

      const title = document.createElement("strong");
      title.textContent = product.name;

      const info = document.createElement("p");
      info.textContent =
        Number(product.price).toFixed(2) +
        " درهم | المخزون: " + product.stock +
        " | الصنف: " + (product.category || "غير محدد");

      const actions = document.createElement("div");
      actions.className = "product-actions";

      const edit = document.createElement("button");
      edit.className = "edit";
      edit.textContent = "✏️ تعديل المنتج";
      edit.onclick = () => editProduct(product);

      const del = document.createElement("button");
      del.className = "danger";
      del.textContent = "حذف المنتج";

      del.onclick = async () => {
        if(!confirm("هل أنت متأكد من حذف المنتج: " + product.name + "؟")){
          return;
        }

        try{
          await api("/api/admin/products/" + product.id,{
            method:"DELETE"
          });

          if(editingId === Number(product.id)){
            resetForm();
          }

          await loadProducts();

        }catch(error){
          alert(error.message);
        }
      };

      actions.append(edit,del);
      div.append(title,info,actions);
      box.appendChild(div);
    });

  }catch(error){
    box.textContent = error.message;
  }
}

async function loadOrders(){
  const box = document.getElementById("orders");
  box.textContent = "جاري تحميل الطلبات...";

  try{
    const data = await api("/api/admin/orders");

    if(!data.orders || !data.orders.length){
      box.textContent = "لا توجد طلبات حاليا.";
      return;
    }

    box.innerHTML = "";

    data.orders.forEach(order => {
      const div = document.createElement("div");
      div.className = "order";

      let itemsText = "";

      try{
        const items = JSON.parse(order.items_json || "[]");

        itemsText = items.map(item =>
          item.name + " × " + item.quantity +
          " = " + Number(item.subtotal).toFixed(2) + " درهم"
        ).join("\n");

      }catch(error){
        itemsText = "تعذر قراءة تفاصيل المنتجات.";
      }

      div.innerHTML = `
        <strong>طلب رقم: ${escapeHTML(order.id)}</strong>
        <p>الزبون: ${escapeHTML(order.customer_name)}</p>
        <p>الهاتف: ${escapeHTML(order.phone)}</p>
        <p>العنوان: ${escapeHTML(order.address)}</p>
        <div class="order-items">${escapeHTML(itemsText)}</div>
        <p><strong>المجموع: ${Number(order.total).toFixed(2)} درهم</strong></p>
        <p>الحالة: ${escapeHTML(order.status || "جديد")}</p>
        <p class="muted">تاريخ الطلب: ${escapeHTML(order.created_at || "")}</p>
      `;

      box.appendChild(div);
    });

  }catch(error){
    box.textContent = error.message;
  }
}
</script>

</body>
</html>
